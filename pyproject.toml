[project]
name = "documind"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "networkx>=3.7",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
